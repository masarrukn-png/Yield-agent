<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dubai Yield Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#EEF2F7; --panel:#FFFFFF; --ink:#0F1B2B; --muted:#57657A; --faint:#8793A5; --line:#DAE1EB; --soft:#F4F7FB;
  --band:#0B1D33; --band2:#133257; --band-ink:#EAF1FA; --band-muted:#9CB1CB; --band-line:#223F63; --hero-em:#6FB6FF;
  --accent:#1D5FD1; --accent-ink:#FFFFFF; --accent-soft:#E0EAFB; --brass:#1D5FD1; --brass-soft:#E0EAFB;
  --good:#1C7A4C; --good-soft:#DDF1E5; --mid:#946300; --mid-soft:#F7ECD3; --bad:#AE3D30; --bad-soft:#F8E3DF;
  --s1:#2A6FD6; --s2:#E0662F; --s3:#179E73; --s4:#C98F00;
  --display:"Bricolage Grotesque","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --body:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 2px rgba(13,43,46,.06),0 8px 24px -12px rgba(13,43,46,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark;
    --ground:#0A111B; --panel:#101A28; --ink:#E4ECF6; --muted:#93A2B6; --faint:#6A788C; --line:#1F2C3E; --soft:#132032;
    --band:#07121F; --band2:#0E2340; --band-ink:#E4ECF6; --band-muted:#8FA5C0; --band-line:#1B3354; --hero-em:#7CBEFF;
    --accent:#6FA8FF; --accent-ink:#06142A; --accent-soft:#15294A; --brass:#7CB4FF; --brass-soft:#15294A;
    --good:#5CC990; --good-soft:#12301F; --mid:#E2AE4A; --mid-soft:#342710; --bad:#EE8373; --bad-soft:#3A1C18;
    --s1:#5B97F0; --s2:#F08452; --s3:#35C194; --s4:#E6B33A; --shadow:0 1px 2px rgba(0,0,0,.4); }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --ground:#0A111B; --panel:#101A28; --ink:#E4ECF6; --muted:#93A2B6; --faint:#6A788C; --line:#1F2C3E; --soft:#132032;
  --band:#07121F; --band2:#0E2340; --band-ink:#E4ECF6; --band-muted:#8FA5C0; --band-line:#1B3354; --hero-em:#7CBEFF;
  --accent:#6FA8FF; --accent-ink:#06142A; --accent-soft:#15294A; --brass:#7CB4FF; --brass-soft:#15294A;
  --good:#5CC990; --good-soft:#12301F; --mid:#E2AE4A; --mid-soft:#342710; --bad:#EE8373; --bad-soft:#3A1C18;
  --s1:#5B97F0; --s2:#F08452; --s3:#35C194; --s4:#E6B33A; --shadow:0 1px 2px rgba(0,0,0,.4); }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ground); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; margin:0}
button,input{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num,.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.01em}

/* header band */
.band{background:radial-gradient(1200px 400px at 85% -20%, var(--band2), transparent 60%), var(--band); color:var(--band-ink); padding-inline:16px; padding-block:22px 0; position:relative; overflow:hidden}
.band::before{content:""; position:absolute; inset:0; background-image:linear-gradient(var(--band-line) 1px, transparent 1px),linear-gradient(90deg,var(--band-line) 1px, transparent 1px); background-size:44px 44px; opacity:.35; mask-image:linear-gradient(180deg,#000 0%,transparent 85%); -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%); pointer-events:none}
.inner{max-width:1080px; margin-inline:auto; position:relative}
.topline{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em}
.logo svg{flex:none}
.stamp{font-family:var(--mono); font-size:11.5px; color:var(--band-muted); letter-spacing:.04em; text-transform:uppercase}
.lang{display:inline-flex; border:1px solid var(--band-line); border-radius:999px; padding:3px; background:rgba(255,255,255,.03)}
.lang button{border:0; background:transparent; color:var(--band-muted); padding:5px 12px; border-radius:999px; cursor:pointer; font-size:13px; font-weight:500}
.lang button[aria-pressed="true"]{background:var(--band-ink); color:var(--band)}
.hero{padding-block:30px 22px; display:grid; gap:18px}
.hero h1{font-family:var(--display); font-weight:800; font-size:clamp(28px,5vw,46px); line-height:1.04; letter-spacing:-.025em; margin:0; max-width:18ch; text-wrap:balance}
.hero h1 em{font-style:normal; color:var(--hero-em)}
.ask form{display:flex; gap:8px; background:var(--panel); border-radius:14px; padding:6px; box-shadow:0 10px 30px -12px rgba(0,0,0,.5)}
.ask input{flex:1; min-width:0; border:0; background:transparent; padding:10px 12px; font-size:15.5px; color:var(--ink)}
.ask input::placeholder{color:var(--faint)}
.ask input:focus{outline:none}
.btn{border:0; background:var(--accent); color:var(--accent-ink); font-weight:600; border-radius:10px; padding:0 20px; cursor:pointer; white-space:nowrap}
.btn:disabled{opacity:.6; cursor:progress}
.tabs{display:flex; gap:4px; margin-top:6px; overflow-x:auto; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0; background:transparent; color:var(--band-muted); padding:12px 16px 14px; cursor:pointer; font-weight:600; font-size:14.5px; border-radius:10px 10px 0 0; display:flex; align-items:center; gap:8px; white-space:nowrap}
.tab .ct{font-family:var(--mono); font-size:11.5px; padding:1px 7px; border-radius:999px; background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{background:var(--ground); color:var(--ink)}
.tab[aria-selected="true"] .ct{background:var(--accent-soft); color:var(--accent)}

/* main */
main{padding-inline:16px; padding-block:26px 64px}
.view{max-width:1080px; margin-inline:auto; display:flex; flex-direction:column; gap:18px}
.head{display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap}
.head h2{font-family:var(--display); font-weight:700; font-size:clamp(22px,3.2vw,30px); letter-spacing:-.02em; line-height:1.12; margin:0; text-wrap:balance}
.head .sub{color:var(--muted); font-size:13.5px; margin-top:4px}
.note{background:var(--mid-soft); color:var(--mid); border-radius:10px; padding:8px 12px; font-size:13.5px}

.controls{display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center}
.ctl{display:flex; align-items:center; gap:8px}
.lab{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600}
.seg{display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px}
.seg button{border:0; background:transparent; padding:6px 11px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--muted); font-weight:500; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--panel)}
.pillbtn{border:1px dashed var(--line); background:transparent; border-radius:999px; padding:5px 12px; font-size:13px; color:var(--muted); cursor:pointer}
.pillbtn:hover{color:var(--ink); border-color:var(--muted)}
.pillbtn b{color:var(--ink); font-weight:600}

/* ranked list */
.list{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); overflow:hidden}
.lh,.lr{display:grid; grid-template-columns:44px minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,1.9fr) 88px; gap:14px; align-items:center; padding:14px 18px}
.lh{background:var(--soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; padding-block:10px}
.lr{border-top:1px solid var(--line); transition:background .15s}
.lr:hover{background:var(--soft)}
.lr.focus{box-shadow:inset 3px 0 0 var(--brass)}
.rk{font-family:var(--mono); color:var(--faint); font-size:13px}
.lr:first-of-type .rk{color:var(--brass); font-weight:600}
.nm b{display:block; font-weight:600; font-size:15.5px; line-height:1.25}
.nm span{color:var(--muted); font-size:13px}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px; white-space:nowrap}
.t-good{background:var(--good-soft); color:var(--good)} .t-mid{background:var(--mid-soft); color:var(--mid)} .t-bad{background:var(--bad-soft); color:var(--bad)}
.t-neu{background:var(--soft); color:var(--muted); border:1px solid var(--line)} .t-acc{background:var(--accent-soft); color:var(--accent)} .t-brass{background:var(--brass-soft); color:var(--brass)}
.yl{display:grid; gap:6px}
.yl .top{display:flex; align-items:baseline; gap:8px}
.yl .big{font-family:var(--mono); font-weight:600; font-size:22px; letter-spacing:-.03em}
.yl .net{font-size:12px; color:var(--muted)}
.meter{height:6px; border-radius:99px; background:var(--soft); overflow:hidden; border:1px solid var(--line)}
.meter i{display:block; height:100%; border-radius:99px}
.m-good{background:var(--good)} .m-mid{background:var(--mid)} .m-bad{background:var(--bad)}
.px{display:grid; grid-template-columns:auto 1fr; gap:3px 10px; font-size:13.5px; align-items:baseline}
.px dt{color:var(--muted); font-size:12px}
.px dd{margin:0; min-width:0}
.px dd .num{font-weight:600}
.px dd small{color:var(--muted); font-size:12px}
.px dd a{color:var(--muted); text-decoration:none}
.px dd a:hover{color:var(--accent); text-decoration:underline}
.act{display:flex; justify-content:flex-end}
.go{display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; text-decoration:none; color:var(--accent); border:1px solid var(--line); border-radius:8px; padding:6px 10px; white-space:nowrap}
.go:hover{border-color:var(--accent); background:var(--accent-soft)}
.flags{display:flex; gap:6px; flex-wrap:wrap; margin-top:5px}
.empty{padding:28px 18px; color:var(--muted); text-align:center}

/* deals */
.deals{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px}
.deal{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:14px}
.d-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start}
.d-eye{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600}
.d-name{font-family:var(--display); font-weight:700; font-size:19px; letter-spacing:-.015em; line-height:1.2; margin-top:2px}
.disc{font-family:var(--mono); font-weight:600; font-size:15px; background:var(--good-soft); color:var(--good); border-radius:10px; padding:6px 9px; white-space:nowrap; text-align:center; line-height:1.1}
.disc small{display:block; font-family:var(--body); font-weight:500; font-size:10.5px; letter-spacing:.02em}
.d-price{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.d-price .num{font-size:24px; font-weight:600; letter-spacing:-.03em}
.d-price span{color:var(--muted); font-size:13px}
.cmp{display:grid; gap:7px}
.cmp .row{display:grid; grid-template-columns:92px 1fr 64px; gap:8px; align-items:center; font-size:12.5px; color:var(--muted)}
.cmp .row .num{text-align:right; color:var(--ink); font-size:12.5px}
.cmp .bar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden}
.cmp .bar i{display:block; height:100%; border-radius:99px}
.b-this{background:var(--accent)} .b-avg{background:var(--faint)}
.cmp .src{font-size:11.5px; color:var(--faint)}
.d-stats{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:12px; overflow:hidden}
.d-stats div{padding:9px 12px; display:grid; gap:1px}
.d-stats div+div{border-left:1px solid var(--line)}
.d-stats b{font-family:var(--mono); font-size:17px; font-weight:600}
.d-stats span{font-size:11.5px; color:var(--muted)}
.bchk{background:var(--soft); border-radius:12px; padding:10px 12px; display:grid; gap:6px}
.bchk-top{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
.stars{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--brass)}
.stars small{font-family:var(--body); font-weight:400; color:var(--muted); font-size:11.5px}
.bchk p{margin:0; font-size:13px; color:var(--ink); line-height:1.45}
.d-foot{display:flex; justify-content:space-between; align-items:flex-end; gap:10px; margin-top:auto}
.d-foot .flags{margin:0}

/* distress */
.distress-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-top:10px;padding:22px 2px 2px;border-top:1px solid var(--line)}
.distress-head h3{font-family:var(--display);font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:0}
.distress-head p{margin:5px 0 0;color:var(--muted);font-size:13px;max-width:720px}
.distress-source{display:flex;align-items:center;gap:8px;flex:none}
.distress-source:before{content:"78";font-family:var(--mono);font-weight:600;font-size:12px;color:var(--accent);background:var(--accent-soft);padding:5px 8px;border-radius:999px}
.distress-source a{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);border:1px solid var(--line);background:var(--panel);padding:7px 11px;border-radius:9px}
.distress-source a:hover{border-color:var(--accent);background:var(--accent-soft)}
.distress-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.distress-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:17px;display:flex;flex-direction:column;gap:12px;min-width:0;transition:transform .15s,box-shadow .15s,border-color .15s}
.distress-card:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 10px 30px -16px rgba(13,43,46,.32)}
.distress-card .d-top{min-height:51px}
.distress-card .d-name{font-size:18px}
.distress-card .disc{background:var(--brass-soft);color:var(--brass);border-radius:9px;font-size:14px;padding:6px 8px}
.distress-original{font-size:11.5px;color:var(--muted);padding:8px 10px;background:var(--soft);border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.distress-detail{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.distress-detail div{background:var(--panel);padding:9px 10px;min-width:0}
.distress-detail span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.distress-detail b{display:block;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.distress-meta{display:flex;gap:6px;flex-wrap:wrap;min-height:24px}
.distress-card .d-foot{padding-top:2px;border-top:1px solid var(--line)}
.distress-card .d-foot .flags{max-width:72%;margin:0}
@media (max-width:900px){.distress-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.distress-head{align-items:flex-start;flex-direction:column}.distress-source{width:100%;justify-content:space-between}.distress-grid{grid-template-columns:1fr}}


/* refined off-plan distress */
.distress-mainhead{margin-bottom:-2px}
.distress-live{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.distress-live b{font-family:var(--mono);font-size:15px;color:var(--ink)}
.distress-live a{margin-left:6px;text-decoration:none;color:var(--accent);font-weight:600}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 4px var(--good-soft)}
.distress-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.distress-source-note{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12.5px}
.distress-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.distress-kpis div{background:var(--panel);padding:12px 14px}
.distress-kpis span{display:block;font-size:10px;letter-spacing:.08em;color:var(--faint);font-weight:700;margin-bottom:3px}
.distress-kpis b{font-family:var(--mono);font-size:15px;letter-spacing:-.02em}
.distress-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid var(--line);padding-top:12px;color:var(--faint);font-size:11.5px}
.distress-footer a{color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
@media(max-width:620px){.distress-live{white-space:normal}.distress-toolbar{align-items:flex-start;flex-direction:column}.distress-kpis{grid-template-columns:1fr}.distress-footer{align-items:flex-start;flex-direction:column}}

/* growth */
.tks{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px}
.tk{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:16px 18px; display:grid; gap:4px; align-content:start}
.tk .n{font-family:var(--mono); font-weight:600; font-size:28px; letter-spacing:-.03em; color:var(--accent)}
.tk b{font-size:14.5px; line-height:1.3}
.tk p{margin:0; color:var(--muted); font-size:13px}
.sh,.sr{display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) 110px 110px 70px minmax(0,2fr); gap:14px; align-items:center; padding:13px 18px}
.sh{background:var(--soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); font-weight:600; padding-block:10px}
.sr{border-top:1px solid var(--line)}
.sr.focus{box-shadow:inset 3px 0 0 var(--brass)}
.gbar{display:flex; align-items:center; gap:8px}
.gbar .meter{flex:1}
.gbar b{font-family:var(--mono); font-size:14px; min-width:44px; text-align:right}
.cell{display:grid; gap:3px; justify-items:start}
.cell .lab{display:none}
.cell small{color:var(--muted); font-size:11.5px}
.read{font-size:13.5px; color:var(--muted)}
.read .cats{display:flex; flex-wrap:wrap; gap:5px; margin-top:6px}
.chartcard{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:0; background:var(--panel); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.chartcard>div{padding:18px}
.chartcard>div+div{border-left:1px solid var(--line); background:var(--soft)}
.chartcard h3,.sect{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:-.01em; margin:0 0 10px}
.chartwrap{position:relative}
svg#gChart{width:100%; height:auto; display:block}
svg .grid{stroke:var(--line); stroke-width:1}
svg .ax{fill:var(--muted); font-size:11px; font-family:var(--mono)}
svg .lbl{fill:var(--ink); font-size:12px; font-family:var(--body); font-weight:600}
.tip{position:absolute; background:var(--ink); color:var(--panel); font-size:12px; padding:6px 9px; border-radius:8px; pointer-events:none; white-space:nowrap}
.steps{display:flex; align-items:baseline; gap:8px; font-family:var(--mono); font-size:26px; font-weight:600; letter-spacing:-.03em; flex-wrap:wrap}
.steps i{font-style:normal; color:var(--faint); font-size:16px}
.steps span:last-child{color:var(--accent)}
.stepl{display:flex; gap:8px; font-size:11.5px; color:var(--muted); margin-top:2px; font-family:var(--mono)}
.ratio p{font-size:13px; color:var(--muted); margin:12px 0 0}
.timeline{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px}
.tl{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px 16px; display:grid; gap:4px; align-content:start}
.tl .when{font-family:var(--mono); font-size:12px; color:var(--brass); font-weight:600}
.tl b{font-size:14.5px}

  function parse(q){
    const s = q.toLowerCase();
    const f = {type:null, bedrooms:"any", minYield:null, count:null, excludeOversupplied:false, basis:"gross", maxBudget:null, unsupported:null};
    if (/villa|townhouse|town house|联排|别墅|排屋/.test(s)) f.type = "house";

{"view":"income"|"growth"|"deals"|"distress","type":"apartment"|"house"|null,"bedrooms":"any"|"studio"|"1"|"2"|"3"|"4"|"5","minYield":number|null,"count":integer|null,"excludeOversupplied":boolean,"basis":"gross"|"net","maxBudget":number|null,"unsupported":string|null}
Rules: view "distress" for off-plan distressed deals, urgent sales and steep discounts (期房急售, 折价); view "growth" for capital appreciation, upside, catalysts, long-term value (升值, 潜力); "deals" for undervalued, bargains, below-market listings (低估, 捡漏, 好房); else "income". ROI/return/回报率 = rental yield. Villas and townhouses (别墅, 联排) = "house". 开间 = studio, 一房 = "1", 两房 = "2", 四房 = "4". Use "net" only if net (净), costs or fees are mentioned. maxBudget is AED (万 = 10,000). excludeOversupplied true if oversupply/supply/pipeline mentioned. "unsupported": under 15 words in ${lang==="zh"?"Simplified Chinese":"English"} for anything this data cannot answer (other emirates, schools, 6+ bedrooms), else null.

    try {
      const f = await sample.json(prompt(q), {modelTier:"quick", signal:ctl.signal});
      if (!f || typeof f !== "object") throw {code:"invalid_json"};
      if (f.view === "growth") routeGrowth(q); else if (f.view === "deals") setView("deals"); else if (f.view === "distress") setView("distress"); else apply(f);
    } catch (e) {
      if (e && e.code === "cancelled") return;
      if (e && ["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)) sample = null;
      local();
    } finally { btn.disabled = false; btn.textContent = t("ask"); }
  }

  // events
  $("askForm").addEventListener("submit", e => { e.preventDefault(); ask($("q").value); });
  $("langEn").addEventListener("click", () => setLang("en"));
  $("langZh").addEventListener("click", () => setLang("zh"));
  $("tabIncome").addEventListener("click", () => setView("income"));
  $("tabDeals").addEventListener("click", () => setView("deals"));
  $("tabDistress").addEventListener("click", () => setView("distress"));
  $("tabGrowth").addEventListener("click", () => setView("growth"));
  const seg = (id, fn) => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.v !== undefined) fn(b.dataset.v); });
  seg("segDistressSort", v => { distressSort = v; renderDistress(); setSeg("segDistressSort", distressSort); });
  seg("segKind", v => { const k = v === "house" ? "h" : "a"; if (S.k === k) return; S.k = k; S.beds = "any"; S.min = k === "h" ? 4 : 6; unsupported = null; renderIncome(); });
  seg("segBeds", v => { S.beds = v; renderIncome(); });
  seg("segMin", v => { S.min = +v; renderIncome(); });
  seg("segBasis", v => { S.basis = v; renderIncome(); });
  seg("segSort", v => { sortBy = v; renderDeals(); });
  seg("segGKind", v => { G.kind = v; renderGrowth(); });
  $("heavyBtn").addEventListener("click", () => { S.hideHeavy = !S.hideHeavy; renderIncome(); });
  $("budgetBtn").addEventListener("click", () => { S.budget = null; renderIncome(); });

  applyLang();
  renderDistress();
  const h = (location.hash || "").slice(1);
  setView(["deals","distress","growth"].includes(h) ? h : "income");
})();
</script>

</body></html>
